<svg xmlns="http://www.w3.org/2000/svg" viewBox="-13 -13 26 26" width="26" height="26">
  <defs>
    <linearGradient id="lensD" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
  </defs>
  <!-- Shadow -->
  <circle cx="0" cy="0" r="11.5" fill="#000000" fill-opacity="0.5"/>
  <!-- Direction Arrow -->
  <path d="M -5 -2 L 0 -11.5 L 5 -2 Z" fill="#00d4ff" stroke="#0f172a" stroke-width="1.3" stroke-linejoin="round"/>
  <!-- White Outer Base -->
  <circle cx="0" cy="0" r="8.5" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
  <!-- Dark Eye / Dome Housing -->
  <circle cx="0" cy="-0.5" r="5.5" fill="#0f172a"/>
  <!-- Glass Optical Sensor -->
  <circle cx="0" cy="-1" r="3" fill="url(#lensD)"/>
  <circle cx="-0.7" cy="-1.7" r="0.8" fill="#ffffff"/>
  <!-- Indicator Dot -->
  <circle cx="0" cy="5" r="1" fill="#ef4444"/>
