<svg xmlns="http://www.w3.org/2000/svg" viewBox="-14 -14 28 28" width="28" height="28">
  <defs>
    <linearGradient id="lensGlassA" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <!-- High Contrast Drop Shadow -->
  <circle cx="0" cy="0" r="12.5" fill="#000000" fill-opacity="0.5"/>
  <!-- Directional Forward Lens Hood / Pointer -->
  <path d="M -6.5 -3 L 0 -13 L 6.5 -3 Z" fill="#00d4ff" stroke="#0f172a" stroke-width="1.4" stroke-linejoin="round"/>
  <!-- Base Pedestal Ring -->
  <circle cx="0" cy="0" r="9" fill="#1e293b" stroke="#ffffff" stroke-width="1.5"/>
  <!-- Inner Turret Core -->
  <circle cx="0" cy="0" r="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <!-- Optical Glass Lens -->
  <circle cx="0" cy="-0.5" r="3.2" fill="url(#lensGlassA)"/>
  <circle cx="-0.8" cy="-1.3" r="0.9" fill="#ffffff"/>
  <!-- Active Recording LED (Small Red Dot at rear) -->
  <circle cx="0" cy="6.2" r="1.2" fill="#ef4444" stroke="#0f172a" stroke-width="0.5"/>
</svg>
